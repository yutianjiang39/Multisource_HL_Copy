<title id="title">性能与规模 / Performance and scale</title>
<desc id="desc">Historical mainnet local submission p99 23 ms across 1765 order samples; simulated two-source bursts at 150 signals per second; eight configurable targets; separate three-target live and five-target rehearsal records. Each result has its own scope.</desc>
