<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">运行简报示例 / A synthetic periodic view</title>
<desc id="desc">Fictional SOURCE_A and SOURCE_B summaries, qualitative observations, and unresolved review items. No real metrics, account values or performance results.</desc>
<!-- Concept illustration: warm paper, deep teal, clear panels; all content synthetic. No production topology or schedule. -->
<rect x="0" y="0" width="1200" height="800" rx="0" fill="#F7F5ED"/>
<rect x="52" y="44" width="32" height="32" rx="9" fill="#173F46"/>
<text x="68" y="66" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">M</text>
<text x="98" y="65" font-size="15" fill="#173F46" font-weight="700" text-anchor="start">MULTISOURCE HL COPY</text>
<rect x="894" y="44" width="254" height="32" rx="16" fill="#E5EFE8"/><text x="1021.0" y="66" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SIMULATED / 合成示例</text>
<text x="52" y="126" font-size="36" fill="#173F46" font-weight="700" text-anchor="start">一页读懂，需要关注什么</text>
<text x="54" y="157" font-size="16" fill="#557479" font-weight="400" text-anchor="start">An illustrative report — qualitative, fictional, and explicit about uncertainty.</text>
<line x1="52" y1="181" x2="1148" y2="181" stroke="#D2DDD6"/>
<rect x="52" y="207" width="1096" height="532" rx="20" fill="#FFFFFF" stroke="#D2DDD6"/>
<text x="80" y="249" font-size="22" fill="#173F46" font-weight="700" text-anchor="start">运行简报 / PERIODIC VIEW</text>
<rect x="825" y="224" width="295" height="32" rx="16" fill="#E5EFE8"/><text x="972.5" y="246" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">虚构观察周期 / FICTIONAL PERIOD</text>
<line x1="80" y1="273" x2="1120" y2="273" stroke="#D2DDD6"/>
<text x="80" y="307" font-size="14" fill="#557479" font-weight="600" text-anchor="start">来源摘要 / SOURCE SUMMARY</text>
<rect x="80" y="328" width="1040" height="66" rx="12" fill="#E5EFE8"/>
<text x="100" y="356" font-size="19" fill="#173F46" font-weight="600" text-anchor="start">SOURCE_A</text>
<text x="100" y="379" font-size="12" fill="#557479" font-weight="400" text-anchor="start">ASSET_X</text>
<text x="355" y="356" font-size="19" fill="#173F46" font-weight="400" text-anchor="start">呈现一项意图变化</text>
<text x="355" y="379" font-size="13" fill="#557479" font-weight="400" text-anchor="start">An intent change is described.</text>
<rect x="929" y="345" width="169" height="32" rx="16" fill="#E5EFE8"/><text x="1013.5" y="367" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SYNTHETIC</text>
<rect x="80" y="408" width="1040" height="66" rx="12" fill="#F7F5ED"/>
<text x="100" y="436" font-size="19" fill="#173F46" font-weight="600" text-anchor="start">SOURCE_B</text>
<text x="100" y="459" font-size="12" fill="#557479" font-weight="400" text-anchor="start">ASSET_Y</text>
<text x="355" y="436" font-size="19" fill="#173F46" font-weight="400" text-anchor="start">未添加新的变化描述</text>
<text x="355" y="459" font-size="13" fill="#557479" font-weight="400" text-anchor="start">No new change description is added.</text>
<rect x="929" y="425" width="169" height="32" rx="16" fill="#E5EFE8"/><text x="1013.5" y="447" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SYNTHETIC</text>
<text x="80" y="525" font-size="14" fill="#557479" font-weight="600" text-anchor="start">状态说明 / OBSERVATIONS</text>
<text x="80" y="558" font-size="20" fill="#173F46" font-weight="400" text-anchor="start">来源摘要与本方结果分开呈现</text>
<text x="80" y="587" font-size="13" fill="#557479" font-weight="400" text-anchor="start">Source summaries and execution outcomes stay separate.</text>
<rect x="660" y="503" width="460" height="203" rx="14" fill="#FCEDD9"/>
<text x="682" y="538" font-size="16" fill="#173F46" font-weight="700" text-anchor="start">需要关注 / REVIEW ITEMS</text>
<text x="682" y="576" font-size="20" fill="#173F46" font-weight="400" text-anchor="start">状态差异仍需核实</text>
<text x="682" y="605" font-size="13" fill="#557479" font-weight="400" text-anchor="start">The illustrated difference remains open.</text>
<text x="682" y="641" font-size="18" fill="#173F46" font-weight="400" text-anchor="start">没有新描述，不代表账户无风险</text>
<text x="682" y="670" font-size="13" fill="#557479" font-weight="400" text-anchor="start">No new note does not mean no risk.</text>
<text x="80" y="638" font-size="19" fill="#2D716A" font-weight="600" text-anchor="start">没有收益或性能测量</text>
<text x="80" y="666" font-size="13" fill="#557479" font-weight="400" text-anchor="start">No return or performance measurement.</text>
<text x="52" y="776" font-size="14" fill="#557479" font-weight="400" text-anchor="start">全部为合成内容，非真实界面、账户或运行记录。 / Synthetic content; not a live UI, account, or record.</text>
</svg>
