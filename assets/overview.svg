<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">Multisource HL Copy · 公开展示 / Public showcase</title>
<desc id="desc">Three conceptual reading lenses: fictional sources, execution concerns, and operator visibility. All content is synthetic.</desc>
