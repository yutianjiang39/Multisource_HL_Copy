<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">系统概览</text>
  <text x="880" y="408" text-anchor="end" font-size="12" fill="#9ca3af">示意，箭头只表示信息大类流向</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <!-- external -->
  <rect x="30" y="80" width="170" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="115" y="118" text-anchor="middle" font-size="16" fill="#111827">来源钱包 ×N</text>
  <text x="115" y="142" text-anchor="middle" font-size="12" fill="#6b7280">公开的挂单与成交</text>
  <rect x="30" y="250" width="170" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="115" y="288" text-anchor="middle" font-size="16" fill="#111827">交易所</text>
  <text x="115" y="312" text-anchor="middle" font-size="12" fill="#6b7280">本方账户</text>
  <!-- execution -->
  <rect x="290" y="140" width="250" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="415" y="178" text-anchor="middle" font-size="18" font-weight="600" fill="#3730a3">执行</text>
  <text x="415" y="204" text-anchor="middle" font-size="12" fill="#4338ca">准入 · 风险记账 · 镜像 / 改价 / 撤单</text>
  <text x="415" y="224" text-anchor="middle" font-size="12" fill="#4338ca">跟随减仓 · 残仓清理 · 恢复</text>
  <text x="415" y="258" text-anchor="middle" font-size="12" fill="#6b7280">Rust，实现私有</text>
  <!-- control -->
  <rect x="290" y="60" width="250" height="56" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="415" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#065f46">控制</text>
  <text x="415" y="106" text-anchor="middle" font-size="12" fill="#047857">人确认后启停 / 调参 / 切换</text>
  <!-- state & report -->
  <rect x="630" y="120" width="240" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="750" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">状态与报告</text>
  <text x="750" y="176" text-anchor="middle" font-size="12" fill="#b45309">状态库 · 独立风控守护</text>
  <text x="750" y="196" text-anchor="middle" font-size="12" fill="#b45309">实时事件 · 定时报告</text>
  <!-- record -->
  <rect x="630" y="250" width="240" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="750" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#5b21b6">事故记录</text>
  <text x="750" y="306" text-anchor="middle" font-size="12" fill="#6d28d9">执行输入，滚动保留近期</text>
  <!-- person -->
  <rect x="630" y="50" width="240" height="44" rx="22" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="750" y="77" text-anchor="middle" font-size="14" fill="#374151">人：授权操作、接收通知</text>
  <!-- arrows -->
  <line x1="200" y1="125" x2="288" y2="185" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="290" y1="250" x2="202" y2="290" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="202" y1="305" x2="292" y2="265" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="415" y1="116" x2="415" y2="138" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="190" x2="628" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="250" x2="628" y2="285" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="630" y1="72" x2="542" y2="84" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="750" y1="120" x2="750" y2="96" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
