<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">风险提示阅读示例 / Reading a risk notice</title>
<desc id="desc">Three views of a fictional state difference: known facts, unresolved outcome, and review questions. No real event or automatic risk action.</desc>
<!-- Concept illustration: warm paper, deep teal, clear panels; all content synthetic. No production topology or schedule. -->
<rect x="0" y="0" width="1200" height="660" rx="0" fill="#F7F5ED"/>
<rect x="52" y="44" width="32" height="32" rx="9" fill="#173F46"/>
<text x="68" y="66" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">M</text>
<text x="98" y="65" font-size="15" fill="#173F46" font-weight="700" text-anchor="start">MULTISOURCE HL COPY</text>
<rect x="894" y="44" width="254" height="32" rx="16" fill="#E5EFE8"/><text x="1021.0" y="66" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SIMULATED / 合成示例</text>
<text x="52" y="126" font-size="36" fill="#173F46" font-weight="700" text-anchor="start">看见风险，也看见未知</text>
<text x="54" y="157" font-size="16" fill="#557479" font-weight="400" text-anchor="start">Risk communication: facts, uncertainty, and review.</text>
<line x1="52" y1="181" x2="1148" y2="181" stroke="#D2DDD6"/>
<rect x="52" y="202" width="216" height="32" rx="16" fill="#E5EFE8"/><text x="160.0" y="224" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SOURCE_A  /  ASSET_X</text>
<text x="52" y="269" font-size="23" fill="#173F46" font-weight="600" text-anchor="start">需要关注的状态差异 / A state difference needing attention</text>
<rect x="52" y="295" width="352" height="246" rx="18" fill="#FFFFFF" stroke="#D2DDD6"/>
<rect x="74" y="315" width="46" height="32" rx="16" fill="#FCEDD9"/><text x="97.0" y="337" font-size="12" fill="#173F46" font-weight="600" text-anchor="middle">01</text>
<text x="74" y="387" font-size="27" fill="#173F46" font-weight="700" text-anchor="start">已知事实</text>
<text x="74" y="412" font-size="12" fill="#557479" font-weight="600" text-anchor="start">KNOWN</text>
<text x="74" y="451" font-size="18" fill="#173F46" font-weight="400" text-anchor="start">示例中出现状态差异</text>
<text x="74" y="475" font-size="12" fill="#557479" font-weight="400" text-anchor="start">A fictional difference is shown.</text>
<text x="74" y="505" font-size="16" fill="#2D716A" font-weight="400" text-anchor="start">这是一条展示记录</text>
<text x="74" y="525" font-size="11" fill="#557479" font-weight="400" text-anchor="start">A presentation record only.</text>
<rect x="424" y="295" width="352" height="246" rx="18" fill="#FFFFFF" stroke="#D2DDD6"/>
<rect x="446" y="315" width="46" height="32" rx="16" fill="#FCEDD9"/><text x="469.0" y="337" font-size="12" fill="#173F46" font-weight="600" text-anchor="middle">02</text>
<text x="446" y="387" font-size="27" fill="#173F46" font-weight="700" text-anchor="start">尚未确认</text>
<text x="446" y="412" font-size="12" fill="#557479" font-weight="600" text-anchor="start">UNCONFIRMED</text>
<text x="446" y="451" font-size="18" fill="#173F46" font-weight="400" text-anchor="start">现有说明不足以确认结果</text>
<text x="446" y="475" font-size="12" fill="#557479" font-weight="400" text-anchor="start">The outcome remains unresolved.</text>
<text x="446" y="505" font-size="16" fill="#2D716A" font-weight="400" text-anchor="start">保留未决信息</text>
<text x="446" y="525" font-size="11" fill="#557479" font-weight="400" text-anchor="start">Keep uncertainty visible.</text>
<rect x="796" y="295" width="352" height="246" rx="18" fill="#FFFFFF" stroke="#D2DDD6"/>
<rect x="818" y="315" width="46" height="32" rx="16" fill="#FCEDD9"/><text x="841.0" y="337" font-size="12" fill="#173F46" font-weight="600" text-anchor="middle">03</text>
<text x="818" y="387" font-size="27" fill="#173F46" font-weight="700" text-anchor="start">人工关注</text>
<text x="818" y="412" font-size="12" fill="#557479" font-weight="600" text-anchor="start">REVIEW</text>
<text x="818" y="451" font-size="18" fill="#173F46" font-weight="400" text-anchor="start">核对对象、范围和证据</text>
<text x="818" y="475" font-size="12" fill="#557479" font-weight="400" text-anchor="start">Review the object, scope and evidence.</text>
<text x="818" y="505" font-size="16" fill="#2D716A" font-weight="400" text-anchor="start">不预设生产处置动作</text>
<text x="818" y="525" font-size="11" fill="#557479" font-weight="400" text-anchor="start">No production action is prescribed.</text>
<text x="52" y="587" font-size="19" fill="#173F46" font-weight="500" text-anchor="start">关注记录不代表风险已经消除。</text>
<text x="52" y="618" font-size="14" fill="#557479" font-weight="400" text-anchor="start">A notice is not proof of resolution. No thresholds, triggers, or internal rules are disclosed.</text>
</svg>
