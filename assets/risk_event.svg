<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">风险事件的三种处理结果</text>
  <text x="880" y="348" text-anchor="end" font-size="12" fill="#9ca3af">示意，触发条件与数值不公开</text>
  <!-- card 1 -->
  <rect x="30" y="60" width="265" height="260" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="162" y="94" text-anchor="middle" font-size="17" font-weight="600" fill="#92400e">⏸ 暂停新增</text>
  <text x="50" y="132" font-size="13" fill="#374151">事件</text>
  <text x="50" y="154" font-size="13" fill="#6b7280">两路行情推送都断线</text>
  <text x="50" y="192" font-size="13" fill="#374151">动作</text>
  <text x="50" y="214" font-size="13" fill="#6b7280">不再新增；已挂镜像</text>
  <text x="50" y="234" font-size="13" fill="#6b7280">宽限期后撤掉</text>
  <text x="50" y="272" font-size="13" fill="#374151">之后</text>
  <text x="50" y="294" font-size="13" fill="#047857">推送恢复、核对通过后自动继续</text>
  <!-- card 2 -->
  <rect x="318" y="60" width="265" height="260" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="450" y="94" text-anchor="middle" font-size="17" font-weight="600" fill="#9f1239">⏹ 停止，撤单保仓</text>
  <text x="338" y="132" font-size="13" fill="#374151">事件</text>
  <text x="338" y="154" font-size="13" fill="#6b7280">出现非本程序挂单，</text>
  <text x="338" y="174" font-size="13" fill="#6b7280">或与来源方向相反</text>
  <text x="338" y="212" font-size="13" fill="#374151">动作</text>
  <text x="338" y="234" font-size="13" fill="#6b7280">停止，撤本程序挂单，保留仓位</text>
  <text x="338" y="272" font-size="13" fill="#374151">之后</text>
  <text x="338" y="294" font-size="13" fill="#b45309">推送通知，等人确认再启动</text>
  <!-- card 3 -->
  <rect x="606" y="60" width="265" height="260" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="738" y="94" text-anchor="middle" font-size="17" font-weight="600" fill="#991b1b">⛔ 停止并平仓</text>
  <text x="626" y="132" font-size="13" fill="#374151">事件</text>
  <text x="626" y="154" font-size="13" fill="#6b7280">净值从本次最高点回撤超限</text>
  <text x="626" y="174" font-size="13" fill="#6b7280">（资金进出不计）</text>
  <text x="626" y="212" font-size="13" fill="#374151">动作</text>
  <text x="626" y="234" font-size="13" fill="#6b7280">撤单，按市场平掉全部仓位</text>
  <text x="626" y="272" font-size="13" fill="#374151">之后</text>
  <text x="626" y="294" font-size="13" fill="#b45309">推送平仓结果；未平完提醒人工</text>
</svg>
