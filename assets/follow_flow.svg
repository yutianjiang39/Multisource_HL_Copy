<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">委托变化阅读示例 / Reading an order change</title>
<desc id="desc">Synthetic source SOURCE_A and ASSET_X. Creation, change, and ending are observations, not proof of an execution-side fill.</desc>
<!-- Concept illustration: warm paper, deep teal, clear panels; all content synthetic. No production topology or schedule. -->
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#F7F5ED"/>
<rect x="52" y="44" width="32" height="32" rx="9" fill="#173F46"/>
<text x="68" y="66" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">M</text>
<text x="98" y="65" font-size="15" fill="#173F46" font-weight="700" text-anchor="start">MULTISOURCE HL COPY</text>
<rect x="894" y="44" width="254" height="32" rx="16" fill="#E5EFE8"/><text x="1021.0" y="66" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SIMULATED / 合成示例</text>
<text x="52" y="126" font-size="36" fill="#173F46" font-weight="700" text-anchor="start">看清一次委托变化</text>
<text x="54" y="157" font-size="16" fill="#557479" font-weight="400" text-anchor="start">Read source intent, execution-side observations, and what remains open.</text>
<line x1="52" y1="181" x2="1148" y2="181" stroke="#D2DDD6"/>
<rect x="52" y="203" width="216" height="32" rx="16" fill="#E5EFE8"/><text x="160.0" y="225" font-size="12" fill="#2D716A" font-weight="600" text-anchor="middle">SOURCE_A  /  ASSET_X</text>
<text x="52" y="275" font-size="14" fill="#557479" font-weight="600" text-anchor="start">场景 / SCENE</text>
<text x="236" y="275" font-size="14" fill="#557479" font-weight="600" text-anchor="start">来源意图 / SOURCE INTENT</text>
<text x="677" y="275" font-size="14" fill="#557479" font-weight="600" text-anchor="start">本方观察 / EXECUTION OBSERVATION</text>
<rect x="52" y="294" width="1096" height="92" rx="14" fill="#FFFFFF" stroke="#D2DDD6"/>
<rect x="68" y="311" width="47" height="47" rx="12" fill="#E5EFE8"/>
<text x="91.5" y="342" font-size="20" fill="#2D716A" font-weight="700" text-anchor="middle">01</text>
<text x="135" y="329" font-size="21" fill="#173F46" font-weight="600" text-anchor="start">创建</text>
<text x="135" y="354" font-size="11" fill="#557479" font-weight="600" text-anchor="start">CREATE</text>
<text x="236" y="330" font-size="21" fill="#173F46" font-weight="400" text-anchor="start">提出一项委托意图</text>
<text x="236" y="358" font-size="14" fill="#557479" font-weight="400" text-anchor="start">A new order intent is described.</text>
<line x1="647" y1="313" x2="647" y2="366" stroke="#D2DDD6"/>
<text x="677" y="330" font-size="21" fill="#173F46" font-weight="400" text-anchor="start">结果在本方视图单独说明</text>
<text x="677" y="358" font-size="13" fill="#557479" font-weight="400" text-anchor="start">Outcome is shown separately.</text>
<rect x="52" y="398" width="1096" height="92" rx="14" fill="#FFFFFF" stroke="#D2DDD6"/>
<rect x="68" y="415" width="47" height="47" rx="12" fill="#E5EFE8"/>
<text x="91.5" y="446" font-size="20" fill="#2D716A" font-weight="700" text-anchor="middle">02</text>
<text x="135" y="433" font-size="21" fill="#173F46" font-weight="600" text-anchor="start">变化</text>
<text x="135" y="458" font-size="11" fill="#557479" font-weight="600" text-anchor="start">CHANGE</text>
<text x="236" y="434" font-size="21" fill="#173F46" font-weight="400" text-anchor="start">来源意图发生变化</text>
<text x="236" y="462" font-size="14" fill="#557479" font-weight="400" text-anchor="start">The source intent changes.</text>
<line x1="647" y1="417" x2="647" y2="470" stroke="#D2DDD6"/>
<text x="677" y="434" font-size="21" fill="#173F46" font-weight="400" text-anchor="start">标出差异与待核实事项</text>
<text x="677" y="462" font-size="13" fill="#557479" font-weight="400" text-anchor="start">Differences and open questions remain visible.</text>
<rect x="52" y="502" width="1096" height="92" rx="14" fill="#FFFFFF" stroke="#D2DDD6"/>
<rect x="68" y="519" width="47" height="47" rx="12" fill="#E5EFE8"/>
<text x="91.5" y="550" font-size="20" fill="#2D716A" font-weight="700" text-anchor="middle">03</text>
<text x="135" y="537" font-size="21" fill="#173F46" font-weight="600" text-anchor="start">结束</text>
<text x="135" y="562" font-size="11" fill="#557479" font-weight="600" text-anchor="start">END</text>
<text x="236" y="538" font-size="21" fill="#173F46" font-weight="400" text-anchor="start">本例中的来源意图结束</text>
<text x="236" y="566" font-size="14" fill="#557479" font-weight="400" text-anchor="start">Source intent ends in this example.</text>
<line x1="647" y1="521" x2="647" y2="574" stroke="#D2DDD6"/>
<text x="677" y="538" font-size="21" fill="#173F46" font-weight="400" text-anchor="start">本方状态仍需独立确认</text>
<text x="677" y="566" font-size="13" fill="#557479" font-weight="400" text-anchor="start">Execution-side state needs separate confirmation.</text>
<rect x="52" y="625" width="1096" height="65" rx="14" fill="#FCEDD9"/>
<text x="72" y="652" font-size="18" fill="#173F46" font-weight="500" text-anchor="start">来源动作不等于本方成交。每个结局都是编排的示例。</text>
<text x="72" y="677" font-size="13" fill="#557479" font-weight="400" text-anchor="start">Source intent does not establish a fill. These are authored examples, not a state machine.</text>
</svg>
